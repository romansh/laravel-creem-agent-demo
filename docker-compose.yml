services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    env_file:
      - ./app/.env
    working_dir: /app
    volumes:
      - ./app:/app
      - ${REPO_MOUNT:-/home/www}:/home/www:delegated
      - app_sqlite_demo:/var/lib/agent-app
      - app_octane_state_demo:/app/storage/octane-state
      - app_logs_demo:/app/storage/logs
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/agent-app/database.sqlite
    ports:
      - "8000:80"
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --admin-port=2019

  queue:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    env_file:
      - ./app/.env
    working_dir: /app
    volumes:
      - ./app:/app
      - ${REPO_MOUNT:-/home/www}:/home/www:delegated
      - app_sqlite_demo:/var/lib/agent-app
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/agent-app/database.sqlite
    command: php artisan queue:work --queue=creem-agent --tries=3 --verbose
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q 'queue:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    env_file:
      - ./app/.env
    working_dir: /app
    volumes:
      - ./app:/app
      - ${REPO_MOUNT:-/home/www}:/home/www:delegated
      - app_sqlite_demo:/var/lib/agent-app
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/agent-app/database.sqlite
    command: sh -lc "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q 'schedule:run'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ngrok:
    image: ngrok/ngrok:latest
    depends_on:
      - app
    env_file:
      - ./app/.env
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_URL: ${NGROK_URL:-}
    entrypoint: sh -c 'if [ -n "$$NGROK_URL" ]; then exec ngrok http app:80 --log=stdout --url "$$NGROK_URL"; else exec ngrok http app:80 --log=stdout; fi'

  simulator:
    build:
      context: ./simulator
      dockerfile: docker/frankenphp/Dockerfile
    env_file:
      - ./simulator/.env
    working_dir: /app
    volumes:
      - ./simulator:/app
      - simulator_sqlite_demo:/var/lib/simulator
      - simulator_octane_state_demo:/app/storage/octane-state
      - simulator_logs_demo:/app/storage/logs
    expose:
      - "80"
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/simulator/database.sqlite
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --admin-port=2019

volumes:
  app_sqlite_demo:
    driver: local
  app_octane_state_demo:
    driver: local
  app_logs_demo:
    driver: local
  simulator_sqlite_demo:
    driver: local
  simulator_octane_state_demo:
    driver: local
  simulator_logs_demo:
    driver: local

services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    working_dir: /app/creem-simulator
    volumes:
      - .:/app
      - ${REPO_MOUNT:-/home/www}:/home/www:delegated
    ports:
      - "8000:80"
      - "5173:5173"
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80

  queue:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    working_dir: /app/creem-simulator
    volumes:
      - .:/app
      - ${REPO_MOUNT:-/home/www}:/home/www:delegated
    command: php artisan queue:work --queue=creem-agent --tries=3 --verbose

  scheduler:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    working_dir: /app/creem-simulator
    volumes:
      - .:/app
      - ${REPO_MOUNT:-/home/www}:/home/www:delegated
    command: sh -lc "while true; do php artisan schedule:run --no-interaction; sleep 60; done"

  ngrok:
    image: ngrok/ngrok:latest
    depends_on:
      - app
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - http
      - app:80
      - --log=stdout
    ports:
      - "4040:4040"

  simulator:
    build:
      context: ./creem-simulator
      dockerfile: docker/frankenphp/Dockerfile
    working_dir: /app
    volumes:
      - ./creem-simulator:/app
    ports:
      - "18080:80"
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80
